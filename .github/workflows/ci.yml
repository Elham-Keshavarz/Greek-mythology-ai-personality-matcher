name: Python checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_api:
        description: 'Run paid OpenAI smoke test (uses GitHub secret)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python source
        run: python -m compileall -q src tests tools app.py
      - name: Check release hygiene (no credentials)
        run: python -m tools.check_release
      - name: Run deterministic tests (no API key, no downloads)
        env:
          OPENAI_API_KEY: ''
          OPENAI_MODEL: ''
        run: python -m pytest -q

  live-openai:
    name: Manual live OpenAI smoke test
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.run_live_api &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Live RAG + OpenAI smoke test (paid)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python -m tools.live_api_smoke
